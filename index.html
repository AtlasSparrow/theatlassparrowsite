<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Binary Studio</title>
<style>
  :root{
    --bg: #0a0c10;
    --bg-deep: #060709;
    --bg-mid: #101722;
    --bg-raised: #161d29;
    --ink: #e6e9ee;
    --ink-dim: #5c6570;
    --accent: #7d9bc4;
    --accent-dim: #4a5f7d;
    --line: #1c2836;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --display: 'Fraunces', Georgia, serif;
  }

  @font-face {
    font-family: 'IBM Plex Mono';
    src: local('IBM Plex Mono');
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(ellipse 120% 80% at 50% 15%, var(--bg-mid) 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--ink);
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    padding: 24px;
  }

  /* faint ambient binary field */
  .field {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: 0.28;
  }
  .field span {
    position: absolute;
    font-size: 11px;
    color: var(--accent-dim);
    font-family: var(--mono);
    user-select: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 640px;
    width: 100%;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .eyebrow::before, .eyebrow::after {
    content: '';
    height: 1px;
    width: 28px;
    background: var(--line);
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .wordmark {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(2.6rem, 8vw, 5rem);
    line-height: 1.02;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
    position: relative;
  }

  .wordmark .decode {
    display: inline-block;
  }

  .wordmark em {
    font-style: normal;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 60%, #2e3d52 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin: 26px 0 44px;
    font-size: 14px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    line-height: 1.7;
  }

  .status-row {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--bg-raised);
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.05em;
  }

  .status-row strong {
    color: var(--ink);
    font-weight: 500;
  }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  footer {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--line);
    letter-spacing: 0.08em;
    z-index: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot, .cursor { animation: none; }
  }
</style>
</head>
<body>

  <div class="field" id="field"></div>

  <div class="stage">
    <p class="eyebrow"><span class="dot"></span> Work in Progress</p>

    <h1 class="wordmark"><span class="decode" id="decode">Dark Binary</span></h1>

    <div class="status-row">
      <span>check back soon<span class="cursor"></span></span>
    </div>
  </div>

  <footer>&copy; <span id="year"></span> Dark Binary Studio</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // ambient binary field
  const field = document.getElementById('field');
  const cols = Math.floor(window.innerWidth / 60);
  const rows = Math.floor(window.innerHeight / 60);
  for (let i = 0; i < cols * rows * 0.22; i++) {
    const s = document.createElement('span');
    s.textContent = Math.random() > 0.5 ? '1' : '0';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    field.appendChild(s);
  }

  // decode-in effect on wordmark, respects reduced motion
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const target = document.getElementById('decode');
  const finalText = target.textContent;

  if (!prefersReduced) {
    const chars = '01';
    let frame = 0;
    const totalFrames = 18;
    target.style.opacity = '1';

    function scramble() {
      if (frame >= totalFrames) {
        target.innerHTML = finalText.replace('Dark', '<em>Dark</em>');
        return;
      }
      let out = '';
      const revealCount = Math.floor((frame / totalFrames) * finalText.length);
      for (let i = 0; i < finalText.length; i++) {
        if (finalText[i] === ' ') { out += ' '; continue; }
        if (i < revealCount) {
          out += finalText[i];
        } else {
          out += chars[Math.floor(Math.random() * chars.length)];
        }
      }
      target.textContent = out;
      frame++;
      requestAnimationFrame(() => setTimeout(scramble, 35));
    }
    scramble();
  } else {
    target.innerHTML = finalText.replace('Dark', '<em>Dark</em>');
  }
</script>

</body>
</html>
