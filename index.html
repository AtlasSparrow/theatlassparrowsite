<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Sparrow Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23E30613%22/></svg>">
<style>
  :root {
    --bg: #0A0A0A;
    --dot: #F5F5F0;
    --red: #E30613;
    --grey: #767676;
    --hairline: #2A2A2A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
  }

  canvas#field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .grid {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    padding: 32px;
    pointer-events: none;
  }

  main {
    grid-column: 1 / span 8;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 100vh;
  }

  .wordmark {
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -0.01em;
    font-size: clamp(3rem, 10vw, 8.5rem);
    text-transform: uppercase;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-top: 24px;
  }

  .status-line .swatch {
    width: 8px;
    height: 8px;
    background: var(--red);
  }

  .meta {
    position: absolute;
    font-size: 0.68rem;
    font-family: 'Courier New', monospace;
    color: var(--grey);
    letter-spacing: 0.03em;
    line-height: 1.6;
  }

  .meta.top-right {
    top: 32px;
    right: 32px;
    text-align: right;
  }

  .meta.bottom-left {
    bottom: 32px;
    left: 32px;
  }

  .copyright {
    position: absolute;
    bottom: 14px;
    left: 32px;
    font-size: 0.68rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.02em;
  }

  @media (max-width: 640px) {
    .grid { padding: 20px; }
    main { grid-column: 1 / -1; }
    .meta { display: none; }
    .copyright { left: 20px; bottom: 12px; }
  }
</style>
</head>
<body>

<canvas id="field"></canvas>

<div class="grid">
  <main>
    <div class="wordmark">
      <div>ATLAS</div>
      <div>SPARROW</div>
      <div>Studio</div>
    </div>
    <div class="status-line"><span class="swatch"></span>WORK IN PROGRESS</div>
  </main>
</div>

<div class="meta top-right" id="metaTop"></div>
<div class="meta bottom-left" id="metaBottom"></div>
<div class="copyright">© 2026 Atlas Sparrow Studio</div>

<script>
(function () {
  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');
  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var COLS = 90;
  var ROWS = 46;
  var tilt = 0.62;      // isometric-ish tilt
  var rot = -0.5;        // rotation of the field for a diagonal sweep

  function noise(x, y, t) {
    return (
      Math.sin(x * 0.18 + t * 0.4) * 0.5 +
      Math.sin(y * 0.24 - t * 0.3) * 0.35 +
      Math.sin((x + y) * 0.11 + t * 0.2) * 0.4 +
      Math.sin(x * 0.05 - y * 0.07 + t * 0.15) * 0.6
    );
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H);

    var spacingX = W / COLS * 1.6;
    var spacingZ = H / ROWS * 1.9;
    var originX = W * 0.62;
    var originY = H * 0.86;
    var cosR = Math.cos(rot), sinR = Math.sin(rot);

    for (var row = 0; row < ROWS; row++) {
      for (var col = 0; col < COLS; col++) {
        var gx = (col - COLS / 2) * spacingX * 0.32;
        var gz = row * spacingZ * 0.32;

        var h = noise(col, row, t) * 46;

        // rotate on the ground plane for a diagonal composition
        var rx = gx * cosR - gz * sinR;
        var rz = gx * sinR + gz * cosR;

        var screenX = originX + rx;
        var screenY = originY - rz * tilt - h;

        if (screenX < -20 || screenX > W + 20 || screenY < -20 || screenY > H + 20) continue;

        var depthFade = 1 - row / ROWS;
        var heightGlow = Math.max(0, h / 46);
        var alpha = (0.06 + depthFade * 0.5) * (0.5 + heightGlow * 0.5);
        var size = 0.6 + heightGlow * 1.6 + depthFade * 0.6;

        ctx.fillStyle = 'rgba(245,245,240,' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  var startTime = performance.now();
  function loop(now) {
    var t = (now - startTime) / 1000;
    render(prefersReducedMotion ? 0 : t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Ambient technical meta labels — decorative readout, no real data
  function hex(n) { return Math.floor(Math.random() * n).toString(16).toUpperCase().padStart(4, '0'); }
  var top = document.getElementById('metaTop');
  var bottom = document.getElementById('metaBottom');
  top.innerHTML = 'FIELD.SYNC — 0x' + hex(65536) + '<br>NODES ' + (90 * 46) + ' / ACTIVE';
  bottom.innerHTML = 'REV 0x' + hex(4096) + '<br>ATLAS-SPARROW.STUDIO';
})();
</script>

</body>
</html>
